spring.application.name=auth_api
spring.application.version= 1.0.0
server.port=8080 

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=s
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Propiedades de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#Swagger documentacion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#JWT
application.security.jwt.secret-key=McvbIKwPayThmKBwFUdHDXzvvFileA2Zvja8JrcCsVNwRP19UVAiNW7G2EFmVK2hnHSI
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# ActiveMQ properties
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.package.trust-all=false
spring.activemq.packages.trusted=com.users.auth_api.entity